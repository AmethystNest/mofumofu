<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20262B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>配給は一人分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#CFCBC1; --panel:#E4E0D6; --ink:#22282C; --dim:#555C60; --line:#A9A69D;
  --warm:#B8741E; --warm-ink:#22282C; --ai:#2E7C77; --ai-bg:#D6E3E0; --bar:#BDB9AF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#20262B; --panel:#2A3137; --ink:#E9E4D8; --dim:#9AA3A6; --line:#3C454C;
    --warm:#E8A33D; --warm-ink:#20262B; --ai:#7FC8C2; --ai-bg:#1D3334; --bar:#3A434A;
  }
}
:root[data-theme="dark"]{
  --bg:#20262B; --panel:#2A3137; --ink:#E9E4D8; --dim:#9AA3A6; --line:#3C454C;
  --warm:#E8A33D; --warm-ink:#20262B; --ai:#7FC8C2; --ai-bg:#1D3334; --bar:#3A434A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 14px 6px}
.top .when{font-size:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.ap{display:flex;gap:4px;align-items:center}
.ap i{width:10px;height:10px;border:1.5px solid var(--warm);border-radius:2px;display:block}
.ap i.on{background:var(--warm)}
.me{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);min-width:0}
.me .mbar{flex:1;height:5px;background:var(--bar);border-radius:3px;overflow:hidden;max-width:90px}
.me .mbar b{display:block;height:100%;background:var(--ink);opacity:.7;transition:width .4s}
.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:13px;color:var(--dim);cursor:pointer}

/* scene */
.scene{position:relative;width:100%;aspect-ratio:360/270;overflow:hidden;flex:0 0 auto}
.scene>svg.room{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene[data-time="morning"]{--sky1:#9FB3BE;--sky2:#D6D3C8;--city:#5B6770;--dark:.05;--lamp:.35}
.scene[data-time="noon"]{--sky1:#B5C2C6;--sky2:#DAD8CF;--city:#66727A;--dark:0;--lamp:.25}
.scene[data-time="evening"]{--sky1:#6C5B6B;--sky2:#D08A52;--city:#3E3A45;--dark:.18;--lamp:.6}
.scene[data-time="night"]{--sky1:#141C26;--sky2:#2B3440;--city:#0E1318;--dark:.42;--lamp:.9}
#dog:focus:not(:focus-visible){outline:none}
#dog{position:absolute;left:38%;bottom:5%;width:52%;overflow:visible;cursor:pointer;touch-action:manipulation}
.fx{position:absolute;left:62%;top:30%;pointer-events:none;font-size:14px;font-weight:700;color:#F3E6C8;
  text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{from{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-38px)}}

/* dog */
#dog .fur{fill:#C98F5A}#dog .fur2{fill:#A96F3E}#dog .cream{fill:#EFE2CC}#dog .inner{fill:#E7C9A5}
#dog .nose{fill:#2A2320}#dog .eye{fill:#211B18}#dog .glint{fill:#fff}
#dog .mouth,#dog .eye-closed{fill:none;stroke:#2A2320;stroke-width:1.8;stroke-linecap:round}
#dog .collar{fill:none;stroke:#8E3B35;stroke-width:5;stroke-linecap:round}#dog .tag{fill:#D9B45A}
#dog .d-shadow{fill:#000;opacity:.28}
#dog .tongue{fill:#D9716B;opacity:0;transition:opacity .2s}
#dog .eye-closed{opacity:0}
#dog .zzz{opacity:0;fill:#F3E6C8;font-size:18px;font-family:serif}
#dog .d-all{transform-origin:95px 165px;transition:transform .5s}
#dog .d-body{transform-origin:90px 164px;animation:breathe 3.4s ease-in-out infinite}
#dog .d-tail{transform-origin:56px 120px;animation:wag 1.3s ease-in-out infinite;transition:transform .4s}
#dog .d-head{transform-origin:116px 98px;animation:tilt 9s ease-in-out infinite;transition:transform .5s}
#dog .d-ear-f{transform-origin:142px 50px;animation:twitch 7s ease-in-out infinite;transition:transform .4s}
#dog .d-ear-b{transform-origin:112px 50px;transition:transform .4s}
#dog .d-eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes wagfast{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}76%,88%{transform:rotate(-6deg)}}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(3deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px)}60%{transform:translateY(0)}78%{transform:translateY(-6px)}}
@keyframes munch{0%,100%{transform:rotate(30deg) translateY(10px)}50%{transform:rotate(26deg) translateY(14px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:.9}100%{opacity:0;transform:translate(10px,-22px)}}
#dog.happy .d-tail{animation:wagfast .32s ease-in-out infinite}
#dog.happy .tongue{opacity:1}
#dog.jump .d-all{animation:hop .6s ease-out}
#dog.eat .d-head{animation:munch .45s ease-in-out infinite}
#dog.eat .d-tail{animation:wagfast .5s ease-in-out infinite}
#dog.sad .d-ear-f,#dog.weak .d-ear-f{animation:none;transform:rotate(-28deg)}
#dog.sad .d-ear-b,#dog.weak .d-ear-b{transform:rotate(-20deg)}
#dog.sad .d-tail,#dog.weak .d-tail{animation:none;transform:rotate(-38deg)}
#dog.weak .d-head{animation:none;transform:rotate(12deg) translateY(6px)}
#dog.sleep .d-head{animation:none;transform:translate(-4px,22px) rotate(20deg)}
#dog.sleep .d-tail{animation:none;transform:rotate(-30deg)}
#dog.sleep .d-ear-f{animation:none;transform:rotate(-18deg)}
#dog.sleep .d-eye{opacity:0}
#dog.sleep .eye-closed{opacity:1}
#dog.sleep .d-body{animation-duration:5s}
#dog.sleep .zzz{opacity:1}
#dog.sleep .zzz text{animation:zz 2.6s linear infinite}
#dog.sleep .zzz text:nth-child(2){animation-delay:.9s}
#dog.sleep .zzz text:nth-child(3){animation-delay:1.8s}

/* drone */
.drone{opacity:0}
.scene.drone-pass .drone{animation:dronefly 5.5s linear forwards}
@keyframes dronefly{0%{opacity:0;transform:translate(0,0)}8%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(170px,-8px)}}
.towerlight{animation:towerblink 2.4s steps(1) infinite}
@keyframes towerblink{0%{opacity:1}50%{opacity:.15}}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:10px 16px 4px}
.stat{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.stat .bar{height:7px;background:var(--bar);border-radius:4px;overflow:hidden}
.stat .bar b{display:block;height:100%;background:var(--warm);border-radius:4px;transition:width .5s}
.stat.low .bar b{background:#B4543F}

/* log */
.log{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px 8px;display:flex;flex-direction:column;gap:6px;-webkit-user-select:text;user-select:text}
.msg{font-size:14px;line-height:1.75;max-width:40em}
.msg.nar{font-family:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP",serif;line-height:1.85}
.msg.ai{background:var(--ai-bg);color:var(--ai);border-left:2px solid var(--ai);padding:4px 10px;font-size:13px;border-radius:0 4px 4px 0}
.msg.ai::before{content:"ミナト　";font-weight:700}
.msg.sys{color:var(--dim);font-size:12.5px}
.msg.old{opacity:.55}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);background:var(--bg)}
.act{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;touch-action:manipulation;min-height:58px}
.act strong{font-size:15px;font-weight:700}
.act small{font-size:11px;color:var(--dim)}
.act:active:not(:disabled){transform:translateY(1px)}
.act:disabled{opacity:.38;cursor:default}
.act.primary{background:var(--warm);border-color:var(--warm);color:var(--warm-ink)}
.act.primary small{color:var(--warm-ink);opacity:.75}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,13,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:82%;overflow-y:auto;background:var(--panel);border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:slideup .25s ease-out}
@keyframes slideup{from{transform:translateY(30px);opacity:.4}}
.sheet h2{margin:0 0 10px;font-size:19px;font-weight:700}
.sheet p{margin:0 0 10px}
.sheet .nar p{font-family:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP",serif;line-height:1.9}
.sheet .ai{background:var(--ai-bg);color:var(--ai);border-left:2px solid var(--ai);padding:6px 10px;margin:0 0 10px;font-size:13.5px;border-radius:0 4px 4px 0}
.sheet .note{color:var(--dim);font-size:12.5px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font-size:15px;touch-action:manipulation}
.btn.primary{background:var(--warm);border-color:var(--warm);color:var(--warm-ink);font-weight:700;text-align:center}
.btn:disabled{opacity:.4;cursor:default}
.btn small{display:block;color:var(--dim);font-size:12px}
.btn.primary small{color:var(--warm-ink);opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 30%;text-align:center;padding:10px 6px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:none}
.item .name{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.item .name span{color:var(--dim);font-weight:400;font-size:13px}
textarea{width:100%;min-height:90px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text}
.loot{margin:4px 0 10px;padding:0;list-style:none}
.loot li{padding:2px 0}

/* title */
.title{position:fixed;inset:0;z-index:20;background:#161B20;color:#E9E4D8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.title .inner{display:flex;gap:28px;align-items:flex-start;max-width:420px;width:100%}
.title h1{writing-mode:vertical-rl;margin:0;font-size:44px;font-weight:700;letter-spacing:.18em;line-height:1.15;flex:0 0 auto;color:#E9E4D8}
.title h1 span{color:#E8A33D}
.title .pro{flex:1;display:flex;flex-direction:column;gap:12px;padding-top:6px}
.title .pro p{margin:0;font-size:15px;line-height:2;opacity:0;animation:reveal .9s ease-out forwards}
.title .pro p.ai{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:13px;color:#7FC8C2;border-left:2px solid #7FC8C2;padding-left:10px;line-height:1.7}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.title form,.title .cont{margin-top:26px;width:100%;max-width:420px;opacity:0;animation:reveal .8s ease-out forwards}
.title label{display:block;font-size:13px;color:#9AA3A6;margin-bottom:6px}
.title input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid #3C454C;background:#20262B;color:#E9E4D8;-webkit-user-select:text;user-select:text}
.title .btn{margin-top:12px;width:100%;background:#2A3137;border-color:#3C454C;color:#E9E4D8}
.title .btn.primary{background:#E8A33D;border-color:#E8A33D;color:#20262B}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .title .pro p,.title form,.title .cont{opacity:1}
}
@media (max-height:640px){.scene{aspect-ratio:360/230}}
</style>
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="when mincho" id="when">1日目　朝</div>
    <div class="ap" id="ap" aria-label="残り行動"></div>
    <div class="me"><span>あなた</span><div class="mbar"><b id="mehp"></b></div></div>
    <button class="iconbtn" id="menuBtn" type="button">設定</button>
  </header>

  <div class="scene" id="scene" data-time="morning">
    <svg class="room" viewBox="0 0 360 270" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/>
        </linearGradient>
        <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#F2B35A" stop-opacity=".55"/><stop offset=".6" stop-color="#E8A33D" stop-opacity=".16"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="win"><rect x="28" y="22" width="150" height="112"/></clipPath>
      </defs>
      <rect width="360" height="270" fill="#3A4540"/>
      <rect x="0" y="0" width="360" height="206" fill="#415049" opacity=".5"/>
      <g clip-path="url(#win)">
        <rect x="28" y="22" width="150" height="112" fill="url(#sky)"/>
        <g style="fill:var(--city)">
          <rect x="28" y="92" width="22" height="42"/><rect x="48" y="78" width="18" height="56"/>
          <rect x="64" y="100" width="26" height="34"/><rect x="88" y="44" width="12" height="90"/>
          <rect x="92" y="36" width="4" height="10"/><rect x="100" y="84" width="24" height="50"/>
          <rect x="122" y="70" width="16" height="64"/><rect x="136" y="96" width="30" height="38"/><rect x="162" y="80" width="16" height="54"/>
        </g>
        <g fill="#7FC8C2" opacity=".85">
          <rect x="52" y="86" width="3" height="3"/><rect x="58" y="96" width="3" height="3"/><rect x="104" y="92" width="3" height="3"/>
          <rect x="126" y="78" width="3" height="3"/><rect x="140" y="104" width="3" height="3"/><rect x="92" y="60" width="4" height="2"/>
        </g>
        <circle class="towerlight" cx="94" cy="35" r="2.2" fill="#E0564B"/>
        <g class="drone" transform="translate(24,58)">
          <rect x="-6" y="-1.5" width="12" height="3" rx="1.5" fill="#1B2228"/>
          <rect x="-9" y="-3.5" width="6" height="1.2" fill="#1B2228"/><rect x="3" y="-3.5" width="6" height="1.2" fill="#1B2228"/>
          <rect x="-2" y="1.5" width="4" height="4" fill="#C9C2B2"/>
          <circle cx="0" cy="0" r="1.2" fill="#7FC8C2"/>
        </g>
      </g>
      <rect x="26" y="20" width="154" height="116" fill="none" stroke="#252C29" stroke-width="5"/>
      <line x1="103" y1="22" x2="103" y2="134" stroke="#252C29" stroke-width="3"/>
      <rect x="22" y="134" width="162" height="7" fill="#2A322E"/>
      <!-- ration chart on wall -->
      <rect x="236" y="42" width="54" height="68" fill="#D8D0BD" opacity=".85" transform="rotate(2 263 76)"/>
      <g stroke="#3A3A34" stroke-width="1" opacity=".6" transform="rotate(2 263 76)">
        <line x1="242" y1="54" x2="284" y2="54"/><line x1="242" y1="64" x2="280" y2="64"/><line x1="242" y1="74" x2="284" y2="74"/>
      </g>
      <g id="tally" stroke="#3A3A34" stroke-width="1.3" transform="rotate(2 263 76)"></g>
      <!-- floor -->
      <rect x="0" y="206" width="360" height="64" fill="#2C302F"/>
      <line x1="0" y1="206" x2="360" y2="206" stroke="#1F2322" stroke-width="2"/>
      <ellipse cx="230" cy="208" rx="150" ry="95" fill="url(#lamp)" style="opacity:var(--lamp)"/>
      <!-- lamp -->
      <line x1="330" y1="0" x2="330" y2="30" stroke="#1C2120" stroke-width="1.5"/>
      <path d="M318,30 L342,30 L336,20 L324,20 Z" fill="#1C2120"/>
      <circle cx="330" cy="32" r="3" fill="#F2C074"/>
      <!-- blanket -->
      <path id="blanket" d="M150,238 Q170,226 220,230 Q270,226 300,240 Q296,254 225,256 Q160,256 150,238 Z" fill="#6E7E86" opacity="0"/>
      <!-- bowl -->
      <path d="M112,244 L140,244 L136,254 L116,254 Z" fill="#7B8488"/>
      <ellipse cx="126" cy="244" rx="14" ry="3" fill="#565D61"/>
      <!-- ball -->
      <g id="ball" opacity="0"><circle cx="318" cy="246" r="8" fill="#9E4A3A"/><path d="M311,243 Q318,248 325,243" stroke="#D9C9A8" stroke-width="1.5" fill="none"/></g>
      <rect width="360" height="270" fill="#0A0E14" style="opacity:var(--dark)"/>
    </svg>

    <svg id="dog" viewBox="0 0 200 180" role="button" tabindex="0" aria-label="犬をなでる">
      <ellipse class="d-shadow" cx="95" cy="167" rx="60" ry="7"/>
      <g class="d-all">
        <g class="d-tail"><path class="fur" d="M58,122 C36,118 26,94 40,82 C50,74 64,82 58,93 C53,101 54,111 64,116 Z"/><path class="cream" d="M44,86 C48,82 55,84 54,90 C50,90 46,89 44,86 Z"/></g>
        <g class="d-body">
          <path class="fur" d="M46,164 C36,136 44,104 74,94 C98,86 122,94 132,116 C138,130 138,150 136,164 Z"/>
          <ellipse class="fur2" cx="66" cy="146" rx="26" ry="20"/>
          <ellipse class="cream" cx="66" cy="163" rx="17" ry="5.5"/>
          <path class="cream" d="M110,100 C126,108 133,126 131,164 L114,164 C116,140 112,118 102,104 Z"/>
          <rect class="fur" x="106" y="122" width="11" height="40" rx="5"/>
          <rect class="fur" x="120" y="120" width="11" height="42" rx="5"/>
          <ellipse class="cream" cx="112" cy="163" rx="8" ry="4"/>
          <ellipse class="cream" cx="126" cy="163" rx="8" ry="4"/>
        </g>
        <g class="d-head">
          <g class="d-ear-b"><path class="fur2" d="M104,60 L109,27 L128,48 Z"/></g>
          <ellipse class="fur" cx="128" cy="68" rx="30" ry="26"/>
          <g class="d-ear-f"><path class="fur" d="M126,46 L143,19 L153,54 Z"/><path class="inner" d="M133,46 L142,28 L147,50 Z"/></g>
          <path class="cream" d="M110,76 C116,92 136,98 150,92 L142,76 Z"/>
          <ellipse class="cream" cx="150" cy="80" rx="18" ry="12"/>
          <ellipse class="cream" cx="136" cy="55" rx="3.2" ry="2"/>
          <ellipse class="nose" cx="166" cy="75" rx="5.5" ry="4.2"/>
          <path class="tongue" d="M152,88 Q154,98 160,96 Q163,91 159,87 Z"/>
          <path class="mouth" d="M164,84 Q158,90 149,87"/>
          <g class="d-eye"><ellipse class="eye" cx="138" cy="64" rx="3.4" ry="3.9"/><circle class="glint" cx="139.2" cy="62.6" r="1.1"/></g>
          <path class="eye-closed" d="M133.5,64.5 Q138,68 142.5,64.5"/>
          <path class="collar" d="M100,95 Q118,108 141,97"/>
          <circle class="tag" cx="121" cy="106" r="3.3"/>
        </g>
      </g>
      <g class="zzz"><text x="150" y="36">z</text><text x="160" y="28" font-size="14">z</text><text x="168" y="20" font-size="11">z</text></g>
    </svg>
  </div>

  <section class="stats" id="stats" aria-label="犬の様子"></section>
  <div class="log" id="log" aria-live="polite"></div>
  <nav class="actions">
    <button class="act" id="aFeed" type="button"><strong>ごはん</strong><small id="foodCount">食料 0</small></button>
    <button class="act" id="aPlay" type="button"><strong>遊ぶ</strong><small>行動1</small></button>
    <button class="act" id="aExplore" type="button"><strong>探しに行く</strong><small>行動2</small></button>
    <button class="act" id="aRest" type="button"><strong>眠る</strong><small>今日を終える</small></button>
  </nav>
</div>

<div class="title mincho" id="title" hidden></div>
<div id="sheetRoot"></div>

<script>
/* ============================================================
   CORE（UIに依存しないゲームルール）
   ============================================================ */
/*CORE-START*/
const Core = (() => {
  const VERSION = 1;
  const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, Math.round(v)));

  function rand(st) {
    st.seed = (st.seed + 0x6D2B79F5) | 0;
    let t = st.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const fmt = (st, s) => s.replace(/\{name\}/g, st.name);

  const ITEMS = {
    ration: '配給食', can: '缶詰', dogfood: 'ドッグフード',
    ball: '古いボール', blanket: '毛布', map: '管理塔周辺の地図'
  };
  const UNIQUE = ['ball', 'blanket', 'map'];

  const LOCS = {
    street: { name: '旧商店街', desc: '静か。食べ物が残っていることがある。', danger: .15,
      loot: [['can', 5], ['dogfood', 3], ['ration', 1], ['none', 3]],
      intro: ['シャッターの降りた商店街を歩いた。自動音声の「いらっしゃいませ」だけが、まだ生きている。',
              '看板の文字が半分剥がれた薬局の前を通った。店内の棚は、ほとんど空だった。'] },
    parking: { name: '地下駐車場', desc: '巡回ドローンが来る。道具が見つかりやすい。', danger: .3,
      loot: [['can', 3], ['dogfood', 2], ['ball', 2], ['blanket', 2], ['map', 2], ['none', 3]],
      intro: ['地下駐車場は冷たく、音がよく響いた。止まったままの車の中を一台ずつ覗いた。',
              '非常灯の緑色だけが続く地下へ降りた。乾いた落ち葉が足元で鳴った。'] },
    tower: { name: '管理塔の外周', desc: '監視が厳しい。配給の予備があるらしい。', danger: .45,
      loot: [['ration', 2], ['can', 3], ['dogfood', 2], ['none', 4]],
      intro: ['管理塔の足元は、街で一番清潔だった。誰も歩かない歩道を、清掃ロボットが今日も磨いている。',
              '塔のガラス面に、自分と犬の姿が小さく映った。'] }
  };

  const AI_MORNING = [
    '本日の大気指数は許容範囲内です。外出の際はマスクを着用してください。',
    '本日も区内の全インフラは正常に稼働しています。',
    'あなたは本区の模範市民です。引き続き規則正しい生活をお願いします。',
    '本日の予定はありません。良い一日を。',
    '夜間の外出は控えてください。巡回ドローンが稼働しています。',
    '昨日の睡眠時間を記録しました。健康状態は良好と推定されます。'
  ];

  const VIGNETTES = [
    '{name}が靴下を片方、どこかへ隠した。探すのはやめておいた。',
    '窓の外、誰もいない交差点で、信号だけが律儀に色を変えている。',
    '{name}の寝言が聞こえた。走る夢を見ているらしく、前足が小さく宙をかいた。',
    '壁の配給表に、鉛筆で一本線を足した。二人で越えた夜の数だ。',
    '雨どいを伝う水の音に、{name}が片耳だけ立てて、また眠った。',
    '古い写真を一枚見つけた。写っている人の名前を、もう思い出せない。{name}が写真の匂いを長いこと嗅いでいた。',
    'ミナトの夜間放送が、明日の天気を読み上げた。聞いているのは、たぶん私たちだけだ。'
  ];

  function log(st, k, t) {
    st.log.push({ k, t: fmt(st, t), d: st.day });
    if (st.log.length > 60) st.log.splice(0, st.log.length - 60);
  }

  function newGame(name, seed) {
    const st = {
      v: VERSION, name: (name || 'ハル').slice(0, 8), day: 1, ap: 3,
      dog: { full: 35, energy: 55, trust: 5, anx: 60 },
      me: { hp: 70, collapsed: false },
      inv: { ration: 0, can: 1, dogfood: 0 },
      gear: { ball: false, blanket: false, map: false },
      daily: { pets: 0, played: false, explored: false, dogAte: false },
      flags: {}, seen: [], registered: null, chapter: 0,
      stats: { explores: 0 }, pendingNight: null,
      seed: (seed == null ? (Date.now() & 0x7fffffff) : seed) | 0,
      log: [], lastSeen: Date.now()
    };
    morning(st, true);
    return st;
  }

  function migrate(obj) {
    if (!obj || typeof obj !== 'object' || obj.v !== VERSION) return null;
    const base = newGame(obj.name || 'ハル', 1);
    const st = Object.assign(base, obj);
    st.dog = Object.assign(base.dog, obj.dog); st.me = Object.assign(base.me, obj.me);
    st.inv = Object.assign({ ration: 0, can: 0, dogfood: 0 }, obj.inv);
    st.gear = Object.assign({ ball: false, blanket: false, map: false }, obj.gear);
    st.daily = Object.assign({ pets: 0, played: false, explored: false, dogAte: false }, obj.daily);
    return st;
  }

  function morning(st, first) {
    st.ap = st.me.collapsed ? 1 : 3; st.apMax = st.ap;
    st.me.collapsed = false;
    st.daily = { pets: 0, played: false, explored: false, dogAte: false };
    const n = st.registered ? 2 : 1;
    st.inv.ration += n;
    if (first) {
      log(st, 'ai', 'おはようございます、市民番号0417。本日の配給、一名分をお届けしました。');
      log(st, 'nar', '玄関の前に、いつもの小さな箱。昨夜拾った犬——{name}が、その匂いを嗅いでいる。');
      log(st, 'sys', '犬をタップするとなでられます。ごはんは行動を使いません。');
      return;
    }
    const who = st.registered ? '市民番号0417、0418' : '市民番号0417';
    log(st, 'ai', `${who}。本日の配給、${n === 2 ? '二名分' : '一名分'}をお届けしました。${AI_MORNING[Math.floor(rand(st) * AI_MORNING.length)]}`);
    if (st.day === 8 && st.chapter === 1) {
      log(st, 'sys', '第1章 おわり。この先も{name}との日々は続きます（第2章は今後追加予定）。');
    }
  }

  function feed(st, item, target) {
    const fx = [];
    if (!st.inv[item] || st.inv[item] < 1) return { ok: false, msg: 'もう残っていない。' };
    const toDog = target === 'dog' || target === 'half';
    if (toDog && st.dog.full >= 95) return { ok: false, msg: '{name}はもうお腹いっぱいのようだ。' };
    st.inv[item]--;
    const add = (who, key, d, label) => {
      const obj = who === 'dog' ? st.dog : st.me;
      const before = obj[key]; obj[key] = clamp(obj[key] + d);
      if (obj[key] !== before) fx.push({ label, d: obj[key] - before });
    };
    let text = '';
    if (item === 'ration') {
      if (target === 'dog') { add('dog', 'full', 45, 'おなか'); add('dog', 'trust', 3, '信頼'); text = '配給食をまるごと{name}にあげた。自分のお腹が小さく鳴った。'; }
      else if (target === 'half') { add('dog', 'full', 24, 'おなか'); add('dog', 'trust', 2, '信頼'); add('me', 'hp', 16, 'あなた'); text = '配給食を半分に割った。一人分を、二人で。'; }
      else { add('me', 'hp', 30, 'あなた'); add('dog', 'anx', 4, ''); text = '配給食を自分で食べた。{name}がじっとこちらを見ていた。'; }
    } else if (item === 'can') {
      if (target === 'dog') { add('dog', 'full', 30, 'おなか'); add('dog', 'trust', 1, '信頼'); text = '缶詰を開けて{name}にあげた。'; }
      else { add('me', 'hp', 20, 'あなた'); text = '缶詰を食べた。塩辛い味がした。'; }
    } else if (item === 'dogfood') {
      add('dog', 'full', 40, 'おなか'); add('dog', 'trust', 1, '信頼'); text = 'ドッグフードをあげた。{name}の尻尾が止まらない。';
    }
    if (toDog) { st.daily.dogAte = true; add('dog', 'anx', -3, ''); }
    log(st, 'nar', text);
    return { ok: true, fx: fx.filter(f => f.label), toDog };
  }

  function pet(st) {
    const fx = [];
    if (st.daily.pets < 3) {
      st.daily.pets++;
      const t0 = st.dog.trust, a0 = st.dog.anx;
      st.dog.trust = clamp(st.dog.trust + 1); st.dog.anx = clamp(st.dog.anx - 4);
      if (st.dog.trust !== t0) fx.push({ label: '信頼', d: st.dog.trust - t0 });
      if (st.dog.anx !== a0) fx.push({ label: '安心', d: a0 - st.dog.anx });
    }
    return { fx };
  }

  function play(st) {
    if (st.ap < 1) return { ok: false, msg: '今日はもう動けない。' };
    if (st.dog.energy < 10) return { ok: false, msg: '{name}は疲れて伏せたままだ。' };
    st.ap -= 1; const firstPlay = !st.daily.played; st.daily.played = true;
    const fx = [];
    const ch = (key, d, label, inv) => { const b = st.dog[key]; st.dog[key] = clamp(b + d); if (label && st.dog[key] !== b) fx.push({ label, d: inv ? b - st.dog[key] : st.dog[key] - b }); };
    ch('energy', -12, 'げんき'); ch('full', -4, ''); ch('trust', firstPlay ? (st.gear.ball ? 6 : 4) : 1, '信頼'); ch('anx', -15, '安心', true);
    const lines = st.gear.ball
      ? ['古いボールを転がした。{name}は廊下の端まで追いかけて、得意げに戻ってきた。', 'ボールを高く投げると、{name}が見事に受け止めた。']
      : ['丸めた靴下で引っぱりっこをした。{name}は本気だった。', '部屋の中で追いかけっこをした。久しぶりに声を出して笑った。'];
    log(st, 'nar', lines[Math.floor(rand(st) * lines.length)]);
    return { ok: true, fx };
  }

  function canDogCome(st) { return st.dog.energy >= 25 && st.dog.full >= 10; }
  function locUnlocked(st, id) {
    if (id !== 'tower') return true;
    return st.gear.map && !st.registered;
  }

  function pickLoot(st, table) {
    const opts = table.filter(([id]) => !(UNIQUE.includes(id) && st.gear[id]));
    const total = opts.reduce((s, o) => s + o[1], 0);
    let r = rand(st) * total;
    for (const [id, w] of opts) { if ((r -= w) < 0) return id; }
    return 'none';
  }

  function explore(st, locId, withDog) {
    const loc = LOCS[locId];
    if (!loc || !locUnlocked(st, locId)) return { ok: false, msg: 'そこへは行けない。' };
    if (st.ap < 2) return { ok: false, msg: '出かけるには時間が足りない。' };
    if (withDog && !canDogCome(st)) withDog = false;
    st.ap -= 2; st.daily.explored = true; st.stats.explores++;
    const lines = [fmt(st, loc.intro[Math.floor(rand(st) * loc.intro.length)])];
    const found = {};
    const addFound = id => { if (id === 'none') return; if (UNIQUE.includes(id) && (st.gear[id] || found[id])) return; found[id] = (found[id] || 0) + 1; };
    if (withDog || rand(st) < .6) addFound(pickLoot(st, loc.loot));
    if (withDog && rand(st) < .2 + st.dog.trust / 100 * .6) {
      const before = JSON.stringify(found);
      addFound(pickLoot(st, loc.loot.filter(l => l[0] !== 'none')));
      lines.push(fmt(st, '{name}が瓦礫の隙間に鼻を突っ込んで、前足で掻きはじめた。' + (JSON.stringify(found) !== before ? 'そこに何かがあった。' : '')));
    }
    let caught = false;
    if (rand(st) < loc.danger) {
      if (withDog && rand(st) < .3 + st.dog.trust / 100 * .6) {
        lines.push(fmt(st, '{name}が急に低くうなった。直後、角の向こうを巡回ドローンの光が横切った。息を殺してやり過ごした。'));
        st.dog.trust = clamp(st.dog.trust + 2);
      } else {
        caught = true;
        lines.push('巡回ドローンに見つかった。「市民番号0417、区域外です」——走って逃げる途中で、荷物の半分を落とした。');
        for (const k of Object.keys(found)) { if (!UNIQUE.includes(k)) { found[k] = Math.floor(found[k] / 2); if (!found[k]) delete found[k]; } }
        st.me.hp = clamp(st.me.hp - 8);
        if (withDog) st.dog.anx = clamp(st.dog.anx + 10);
      }
    }
    for (const [k, n] of Object.entries(found)) {
      if (UNIQUE.includes(k)) st.gear[k] = true; else st.inv[k] = (st.inv[k] || 0) + n;
    }
    if (found.map) lines.push('折りたたまれた紙を広げると、管理塔の周りの地図だった。配給の予備倉庫に印がついている。');
    st.me.hp = clamp(st.me.hp - 10);
    if (withDog) {
      st.dog.energy = clamp(st.dog.energy - 25); st.dog.full = clamp(st.dog.full - 10);
      st.dog.trust = clamp(st.dog.trust + 2); st.dog.anx = clamp(st.dog.anx - 5);
    } else {
      st.dog.anx = clamp(st.dog.anx + 15);
      lines.push(fmt(st, '帰ると、{name}が扉のすぐ内側で待っていた。'));
    }
    const summary = Object.keys(found).length ? Object.entries(found).map(([k, n]) => ITEMS[k] + (UNIQUE.includes(k) ? '' : ' ×' + n)).join('、') : '';
    log(st, 'nar', `${loc.name}へ${withDog ? '{name}と' : '一人で'}出かけた。` + (summary ? `持ち帰ったもの：${summary}。` : '何も見つからなかった。'));
    return { ok: true, lines, found, caught, withDog };
  }

  /* ---------- 夜 ---------- */
  const EVENTS = {
    n1: { title: '寝床',
      text: st => ['{name}は部屋の隅で、小さく丸まっている。こちらを見ては、目をそらす。'],
      choices: [
        { label: '「こっちにおいで」と呼ぶ', apply: st => {
          if (st.dog.trust >= 10) { st.dog.trust = clamp(st.dog.trust + 4); st.dog.anx = clamp(st.dog.anx - 6); return ['少し迷ってから、{name}は足元まで来て、背中を向けて寝そべった。'] }
          st.dog.trust = clamp(st.dog.trust + 2); return ['耳だけが、こちらを向いた。まだ少し遠い。'] } },
        { label: 'そっとしておく', apply: st => { st.dog.anx = clamp(st.dog.anx - 5); return ['しばらくして、静かな寝息が聞こえ始めた。'] } }
      ] },
    n2: { title: '夜間放送',
      text: st => ['[ai]本日の区内生体反応：1。異常はありません。おやすみなさい。',
                   '1。——それは私のことだ。足元の{name}は、その数に入っていない。'] },
    n3: { title: '首輪の札', cond: st => st.stats.explores >= 1,
      text: st => ['外でついた泥を拭いていると、首輪に小さな金属の札が付いているのに気づいた。刻まれた文字は擦れて読めない。'],
      choices: [
        { label: '札を付けたままにする', apply: st => { st.dog.trust = clamp(st.dog.trust + 3); st.flags.tag = 'keep'; return ['前の家族のことを、この子は覚えているのだろうか。'] } },
        { label: '札を外して、引き出しにしまう', apply: st => { st.dog.anx = clamp(st.dog.anx - 4); st.flags.tag = 'remove'; return ['今日から、この子の名前は{name}だ。'] } }
      ] },
    n3b: { title: '窓辺',
      text: st => ['外が気になるのか、{name}は窓のそばから動かない。明日は一緒に出かけてみようか。'] },
    n4: { title: '不一致',
      text: st => ['机の上の端末が、夜中に光った。',
                   '[ai]市民番号0417。配給の消費量と、あなたの体重の推移に不一致を検知しました。体調に問題はありませんか？'],
      choices: [
        { label: '「問題ありません」と入力する', apply: st => { st.flags.lied = true; return ['[ai]承知しました。良い夜を。', '画面が暗くなるまで、息を止めていた。'] } },
        { label: '何も答えない', apply: st => { st.flags.silent = true; st.dog.anx = clamp(st.dog.anx + 4); return ['[ai]応答がありません。明朝、再確認します。', '{name}が、光る画面をじっと見ていた。'] } }
      ] },
    n5: { title: '雷',
      text: st => st.dog.trust >= 35
        ? ['遠くで雷が鳴った。{name}が震えながら、私の膝の間に鼻先をねじ込んできた。朝まで、そのままでいた。']
        : ['遠くで雷が鳴った。{name}はベッドの下にもぐり込み、朝まで出てこなかった。'],
      after: st => { if (st.dog.trust >= 35) { st.dog.trust = clamp(st.dog.trust + 5); st.dog.anx = clamp(st.dog.anx - 5); } else st.dog.anx = clamp(st.dog.anx + 8); } },
    n6: { title: '話',
      text: st => ['人がいなくなった日のことを、{name}に話した。朝、目が覚めたら街が静かだったこと。ミナトだけが、何事もなかったように配給を続けたこと。',
                   '{name}は、最後まで目を開けて聞いていた。'].concat(st.flags.lied ? ['[ai]消費量の不一致、継続中。観察を続けます。'] : []) },
    ch1: { title: '市民登録',
      text: st => ['端末の画面に、見慣れない項目が表示されていた。',
                   '[ai]市民登録の申請を受け付けます。同居する生体を、市民として登録できます。登録された市民には、配給が支給されます。',
                   '小さな注記が続いていた。「登録市民は、管理区域外への立ち入りを制限されます」',
                   '{name}が、首をかしげてこちらを見上げた。'],
      choices: [
        { label: '{name}を市民として登録する', sub: '配給が二人分になる。管理塔の外周へは行けなくなる。', apply: st => {
          st.registered = true; st.chapter = 1;
          return ['[ai]登録を完了しました。市民番号0418、{name}。ようこそ。',
                  st.dog.trust >= 70 ? '番号で呼ばれても、{name}は私の顔しか見ていなかった。それでいい、と思った。'
                                     : '番号を与えられた{name}は、落ち着かない様子で部屋を一周した。この子は、まだ私のものでも、街のものでもない。'] } },
        { label: '登録しない', sub: '配給は一人分のまま。{name}は数に入らない。', apply: st => {
          st.registered = false; st.chapter = 1; st.dog.trust = clamp(st.dog.trust + 10);
          return ['申請画面を閉じた。', st.dog.trust >= 70
            ? '数に入らなくていい。一人分を、これからも二人で分ける。{name}が、私の手に顎をのせた。'
            : '一人分を二人で分ける日々は続く。{name}はまだ、私のことを少しだけ警戒している。'] } }
      ] },
    vig: { title: '夜', text: st => [VIGNETTES[st.flags.vig % VIGNETTES.length]] }
  };

  function chooseNight(st) {
    const d = st.day;
    if (d === 1) return 'n1';
    if (d === 2) return 'n2';
    if (d === 3) return EVENTS.n3.cond(st) ? 'n3' : 'n3b';
    if (d === 4) return 'n4';
    if (d === 5) return 'n5';
    if (d === 6) return 'n6';
    if (d === 7) return 'ch1';
    if (st.day >= 8 && st.chapter === 0) return 'ch1';
    st.flags.vig = (st.flags.vig == null ? Math.floor(rand(st) * VIGNETTES.length) : st.flags.vig + 1);
    return 'vig';
  }

  function rest(st) {
    if (st.pendingNight) return st.pendingNight;
    const lines = [];
    const dog = st.dog;
    const hungry = dog.full < 20;
    dog.full = clamp(dog.full - 22);
    const rec = (st.gear.blanket ? 45 : 35) * (hungry ? .5 : 1);
    dog.energy = clamp(dog.energy + rec);
    dog.anx = clamp(dog.anx + 6 + (st.daily.played ? 0 : 8) + (hungry ? 10 : 0) - (st.daily.pets >= 3 ? 4 : 0));
    if (hungry) lines.push('{name}はお腹を空かせて、何度も鼻を鳴らした。');
    if (!st.daily.played && st.daily.pets === 0) lines.push('今日は、あまり構ってあげられなかった。');
    st.me.hp = clamp(st.me.hp - 18);
    if (st.me.hp <= 0) {
      st.me.hp = 25; st.me.collapsed = true;
      lines.push('体に力が入らない。明日は、あまり動けそうにない。');
    } else if (st.me.hp < 25) lines.push('自分の手が、かすかに震えている。');
    if (st.gear.blanket) lines.push('毛布の上で、{name}が丸くなった。');
    const id = chooseNight(st);
    const ev = EVENTS[id];
    if (ev.after) ev.after(st);
    st.pendingNight = { id, lines: lines.map(l => fmt(st, l)), text: ev.text(st).map(l => fmt(st, l)), resolved: false, result: [] };
    return st.pendingNight;
  }

  function nightChoices(st) {
    const p = st.pendingNight; if (!p) return [];
    const ev = EVENTS[p.id];
    return (ev.choices || []).map(c => ({ label: fmt(st, c.label), sub: c.sub ? fmt(st, c.sub) : '' }));
  }

  function resolveNight(st, idx) {
    const p = st.pendingNight; if (!p || p.resolved) return p ? p.result : [];
    const ev = EVENTS[p.id];
    let res = [];
    if (ev.choices && ev.choices[idx]) res = ev.choices[idx].apply(st).map(l => fmt(st, l));
    p.resolved = true; p.result = res;
    if (!st.seen.includes(p.id)) st.seen.push(p.id);
    const all = p.text.concat(res).filter(t => !t.startsWith('[ai]'));
    const last = all[all.length - 1];
    if (last) log(st, 'nar', last);
    return res;
  }

  function nextDay(st) {
    if (!st.pendingNight || !st.pendingNight.resolved) return false;
    st.pendingNight = null;
    st.day++;
    morning(st, false);
    return true;
  }

  function timeOfDay(st) {
    if (st.pendingNight) return 'night';
    if (st.ap <= 0) return 'night';
    const spent = (st.apMax || 3) - st.ap;
    return spent <= 0 ? 'morning' : spent === 1 ? 'noon' : 'evening';
  }

  function welcomeBack(st, now) {
    const h = (now - (st.lastSeen || now)) / 36e5;
    if (h >= 4 && !st.pendingNight) {
      st.dog.anx = clamp(st.dog.anx + 3);
      log(st, 'nar', '戻ってくると、{name}が扉の前で待っていた。尻尾が床を打つ音がする。');
      return true;
    }
    return false;
  }

  return { VERSION, ITEMS, LOCS, newGame, migrate, feed, pet, play, explore, canDogCome, locUnlocked,
           rest, nightChoices, resolveNight, nextDay, timeOfDay, welcomeBack, fmt, clamp };
})();
/*CORE-END*/

/* ============================================================
   UI
   ============================================================ */
const $ = s => document.querySelector(s);
const SAVE_KEY = 'haikyu-hitoribun:v1';
let st = null;
let storageOK = true;
let soundOn = true;
try { soundOn = localStorage.getItem(SAVE_KEY + ':sound') !== 'off'; } catch (e) { storageOK = false; }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function save() {
  if (!st) return;
  st.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); storageOK = true; } catch (e) { storageOK = false; }
}
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? Core.migrate(JSON.parse(s)) : null; } catch (e) { return null; }
}

/* ---------- sound ---------- */
let actx = null;
function audio() {
  if (!soundOn) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { return null; }
  return actx;
}
function tone(freq, t0, dur, type = 'sine', vol = .06, freqEnd) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime + t0);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, a.currentTime + t0 + dur);
  g.gain.setValueAtTime(0, a.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + t0 + dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05);
}
const sfx = {
  chime() { tone(880, 0, .35, 'sine', .05); tone(660, .18, .5, 'sine', .05); },
  pet() { tone(520, 0, .12, 'triangle', .05, 700); },
  wuf() { tone(330, 0, .12, 'square', .025, 190); tone(300, .16, .1, 'square', .02, 180); },
  step() { tone(200, 0, .08, 'triangle', .04); },
  night() { tone(392, 0, .6, 'sine', .04); tone(294, .3, .9, 'sine', .035); }
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- render ---------- */
const TIME_LABEL = { morning: '朝', noon: '昼', evening: '夕方', night: '夜' };
let dogTemp = null, dogTempTimer = null;

function dogBaseState() {
  if (st.pendingNight) return 'sleep';
  const d = st.dog;
  if (d.energy < 20 || d.full < 15) return 'weak';
  if (d.anx > 70) return 'sad';
  return '';
}
function setDogTemp(cls, ms) {
  dogTemp = cls; clearTimeout(dogTempTimer);
  renderDog();
  dogTempTimer = setTimeout(() => { dogTemp = null; renderDog(); }, ms);
}
function renderDog() {
  const el = $('#dog');
  const base = dogBaseState();
  const cls = dogTemp ? (dogTemp === 'jump' ? 'jump happy' : dogTemp) : base;
  el.setAttribute('class', cls);
}

function renderStats() {
  const d = st.dog;
  const rows = [['おなか', d.full], ['げんき', d.energy], ['信頼', d.trust], ['安心', 100 - d.anx]];
  $('#stats').innerHTML = rows.map(([l, v]) =>
    `<div class="stat${v < 20 && l !== '信頼' ? ' low' : ''}"><span>${l}</span><div class="bar" role="meter" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><b style="width:${v}%"></b></div></div>`).join('');
}

function renderLog() {
  const box = $('#log');
  const items = st.log.slice(-14);
  box.innerHTML = items.map(m => `<div class="msg ${m.k}${m.d < st.day ? ' old' : ''}">${esc(m.t)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function renderTally() {
  const g = $('#tally'); const n = Math.min(st.day - 1, 30);
  let s = '';
  for (let i = 0; i < n; i++) {
    const grp = Math.floor(i / 5), k = i % 5, x0 = 242 + (grp % 4) * 11, y0 = 82 + Math.floor(grp / 4) * 12;
    s += k < 4 ? `<line x1="${x0 + k * 2}" y1="${y0}" x2="${x0 + k * 2}" y2="${y0 + 8}"/>` : `<line x1="${x0 - 1}" y1="${y0 + 6}" x2="${x0 + 8}" y2="${y0 + 2}"/>`;
  }
  g.innerHTML = s;
}

function render() {
  const tod = Core.timeOfDay(st);
  $('#when').textContent = `${st.day}日目　${TIME_LABEL[tod]}`;
  $('#ap').innerHTML = [0, 1, 2].map(i => `<i class="${i < st.ap ? 'on' : ''}"></i>`).join('');
  $('#ap').setAttribute('aria-label', `残り行動 ${st.ap}`);
  $('#mehp').style.width = st.me.hp + '%';
  $('#scene').dataset.time = tod;
  $('#blanket').setAttribute('opacity', st.gear.blanket ? '1' : '0');
  $('#ball').setAttribute('opacity', st.gear.ball ? '1' : '0');
  const food = st.inv.ration + st.inv.can + st.inv.dogfood;
  $('#foodCount').textContent = `食料 ${food}`;
  const night = !!st.pendingNight;
  $('#aFeed').disabled = night;
  $('#aPlay').disabled = night || st.ap < 1;
  $('#aExplore').disabled = night || st.ap < 2;
  $('#aRest').disabled = night;
  $('#aRest').classList.toggle('primary', st.ap === 0 && !night);
  renderStats(); renderLog(); renderDog(); renderTally();
}

function showFx(fx) {
  const scene = $('#scene');
  fx.forEach((f, i) => {
    if (!f.d) return;
    const s = document.createElement('div');
    s.className = 'fx';
    s.textContent = `${f.label} ${f.d > 0 ? '+' : ''}${f.d}`;
    s.style.animationDelay = (i * .18) + 's';
    s.style.top = (30 - i * 9) + '%';
    scene.appendChild(s);
    setTimeout(() => s.remove(), 1800 + i * 200);
  });
}

/* ---------- sheet ---------- */
function openSheet(title, bodyHTML, buttons, opts = {}) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2 class="${opts.mincho ? 'mincho' : ''}">${esc(title)}</h2><div class="${opts.nar ? 'nar' : ''}">${bodyHTML}</div>
    <div class="btns"></div></div></div>`;
  const wrap = root.querySelector('.btns');
  buttons.forEach(b => {
    if (b.html) { const d = document.createElement('div'); d.innerHTML = b.html; wrap.appendChild(d); return; }
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'btn' + (b.primary ? ' primary' : '');
    el.innerHTML = esc(b.label) + (b.sub ? `<small>${esc(b.sub)}</small>` : '');
    if (b.disabled) el.disabled = true;
    el.addEventListener('click', b.onClick);
    wrap.appendChild(el);
  });
  const bd = root.querySelector('.backdrop');
  if (opts.dismiss !== false) bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
  const first = root.querySelector('.btn:not(:disabled)'); if (first) first.focus({ preventScroll: true });
}
function closeSheet() { $('#sheetRoot').innerHTML = ''; }
const para = lines => lines.map(l => l.startsWith('[ai]') ? `<div class="ai">ミナト　${esc(l.slice(4))}</div>` : `<p>${esc(l)}</p>`).join('');

/* ---------- actions ---------- */
function onFeed() {
  const inv = st.inv, name = st.name;
  const opt = (item, target, label, sub) => ({ label, sub, disabled: !inv[item], onClick: () => doFeed(item, target) });
  const html = `<p class="note">${esc(name)}　おなか ${st.dog.full}　／　あなた　体力 ${st.me.hp}</p>`;
  const btns = [];
  btns.push({ html: `<div class="item"><div class="name">配給食<span>×${inv.ration}</span></div></div>` });
  btns.push(opt('ration', 'half', '半分こする', `${name}と自分で分ける`));
  btns.push(opt('ration', 'dog', `${name}にあげる`, 'おなか +45'));
  btns.push(opt('ration', 'me', '自分で食べる', '体力 +30'));
  btns.push({ html: `<div class="item"><div class="name">缶詰<span>×${inv.can}</span></div></div>` });
  btns.push(opt('can', 'dog', `${name}にあげる`, 'おなか +30'));
  btns.push(opt('can', 'me', '自分で食べる', '体力 +20'));
  if (inv.dogfood) {
    btns.push({ html: `<div class="item"><div class="name">ドッグフード<span>×${inv.dogfood}</span></div></div>` });
    btns.push(opt('dogfood', 'dog', `${name}にあげる`, 'おなか +40'));
  }
  btns.push({ label: 'とじる', onClick: closeSheet });
  openSheet('ごはん', html, btns);
}
function doFeed(item, target) {
  const r = Core.feed(st, item, target);
  closeSheet();
  if (!r.ok) { toastLog(Core.fmt(st, r.msg)); return; }
  if (r.toDog) { setDogTemp('eat', 2200); sfx.pet(); } else sfx.step();
  showFx(r.fx); save(); render();
}
function toastLog(t) { st.log.push({ k: 'sys', t, d: st.day }); renderLog(); }

function onPet() {
  if (!st || st.pendingNight) return;
  const r = Core.pet(st);
  setDogTemp('jump', 700); sfx.pet(); buzz(15);
  if (Math.random() < .35) setTimeout(sfx.wuf, 180);
  showFx(r.fx); save(); render();
}

function onPlay() {
  const r = Core.play(st);
  if (!r.ok) { toastLog(Core.fmt(st, r.msg)); return; }
  setDogTemp('jump', 1400); sfx.wuf(); buzz(25);
  setTimeout(() => setDogTemp('happy', 1800), 650);
  showFx(r.fx); save(); render();
}

function onExplore() {
  const can = Core.canDogCome(st);
  const html = can ? `<p class="note">${esc(st.name)}と一緒なら、見つかるものが増える。</p>`
    : `<p class="note">${esc(st.name)}は${st.dog.full < 10 ? 'お腹を空かせていて' : '疲れていて'}、今日は一緒に行けない。一人で行くこともできる。</p>`;
  const btns = Object.entries(Core.LOCS).map(([id, l]) => {
    const open = Core.locUnlocked(st, id);
    let sub = l.desc;
    if (!open) sub = id === 'tower' && st.registered ? '登録市民は立ち入れない。' : '場所がわからない。地図があれば…';
    return { label: l.name, sub, disabled: !open, onClick: () => doExplore(id, can) };
  });
  btns.push({ label: 'やめておく', onClick: closeSheet });
  openSheet(can ? `${st.name}と探しに行く` : '一人で探しに行く', html, btns);
}
function doExplore(id, withDog) {
  const r = Core.explore(st, id, withDog);
  if (!r.ok) { closeSheet(); toastLog(Core.fmt(st, r.msg)); return; }
  save(); render(); sfx.step();
  const list = Object.entries(r.found).map(([k, n]) => `<li>${esc(Core.ITEMS[k])}${['ball', 'blanket', 'map'].includes(k) ? '' : ' ×' + n}</li>`).join('');
  const html = para(r.lines) + `<p class="note">持ち帰ったもの</p>` + (list ? `<ul class="loot">${list}</ul>` : '<p>なし</p>');
  openSheet(Core.LOCS[id].name, html, [{ label: '部屋に戻る', primary: true, onClick: () => { closeSheet(); if (r.found.ball || r.found.blanket) setDogTemp('happy', 2000); } }], { nar: true, dismiss: false });
}

function onRest() {
  if (st.ap > 0) {
    openSheet('今日を終える', `<p>まだ行動できます（残り${st.ap}）。今日を終えて眠りますか？</p>`, [
      { label: '眠る', primary: true, onClick: () => { closeSheet(); goNight(); } },
      { label: 'まだ起きている', onClick: closeSheet }
    ]);
  } else goNight();
}
function goNight() {
  clearTimeout(dogTempTimer); dogTemp = null;
  Core.rest(st); save(); render(); sfx.night();
  showNight();
}
function showNight() {
  const p = st.pendingNight;
  const head = p.lines.length ? `<div>${para(p.lines)}</div><hr style="border:none;border-top:1px solid var(--line);margin:12px 0">` : '';
  if (p.resolved) {
    openSheet(`${st.day}日目の夜`, head + para(p.text) + para(p.result), [{ label: '朝を待つ', primary: true, onClick: morningFlow }], { nar: true, mincho: true, dismiss: false });
    return;
  }
  const choices = Core.nightChoices(st);
  const btns = choices.length
    ? choices.map((c, i) => ({ label: c.label, sub: c.sub, onClick: () => { Core.resolveNight(st, i); save(); showNight(); } }))
    : [{ label: '眠る', primary: true, onClick: () => { Core.resolveNight(st, 0); save(); morningFlow(); } }];
  openSheet(`${st.day}日目の夜`, head + `<p class="note">${esc(eventTitle(p.id))}</p>` + para(p.text), btns, { nar: true, mincho: true, dismiss: false });
}
function eventTitle(id) { return { n1: '寝床', n2: '夜間放送', n3: '首輪の札', n3b: '窓辺', n4: '不一致', n5: '雷', n6: '話', ch1: '第1章　終　市民登録', vig: '' }[id] || ''; }
function morningFlow() {
  closeSheet();
  Core.nextDay(st); save(); render();
  const sc = $('#scene'); sc.classList.remove('drone-pass'); void sc.offsetWidth; sc.classList.add('drone-pass');
  setTimeout(sfx.chime, 900);
  setTimeout(() => setDogTemp('jump', 700), 1200);
}

/* ---------- settings ---------- */
function onMenu() {
  const btns = [
    { label: `サウンド：${soundOn ? 'オン' : 'オフ'}`, onClick: () => { soundOn = !soundOn; try { localStorage.setItem(SAVE_KEY + ':sound', soundOn ? 'on' : 'off'); } catch (e) {} onMenu(); } },
    { label: 'セーブを書き出す', sub: 'バックアップ用の文字列をコピーできます', onClick: exportSave },
    { label: 'セーブを読み込む', sub: '書き出した文字列から復元します', onClick: importSave },
    { label: 'はじめからやり直す', onClick: confirmReset },
    { label: 'とじる', onClick: closeSheet }
  ];
  const note = storageOK ? '進行は自動で端末に保存されます。' : 'この環境では自動保存が使えません。こまめに書き出してください。';
  openSheet('設定', `<p class="note">${note}</p>`, btns);
}
function exportSave() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(st))));
  openSheet('セーブを書き出す', `<textarea id="exp" readonly>${esc(code)}</textarea>`, [
    { label: 'コピー', primary: true, onClick: async () => { const t = $('#exp'); t.select(); try { await navigator.clipboard.writeText(code); toastLog('セーブをコピーしました。'); } catch (e) { document.execCommand && document.execCommand('copy'); } closeSheet(); } },
    { label: 'とじる', onClick: closeSheet }]);
}
function importSave() {
  openSheet('セーブを読み込む', `<textarea id="imp" placeholder="書き出した文字列を貼り付け"></textarea><p class="note">今の進行は上書きされます。</p>`, [
    { label: '読み込む', primary: true, onClick: () => {
      try {
        const obj = Core.migrate(JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))));
        if (!obj) throw 0;
        st = obj; save(); closeSheet(); render(); toastLog('セーブを読み込みました。');
        if (st.pendingNight) showNight();
      } catch (e) { toastLog('読み込めませんでした。文字列が途中で切れていないか確認してください。'); closeSheet(); }
    } },
    { label: 'やめる', onClick: closeSheet }]);
}
function confirmReset() {
  openSheet('はじめからやり直す', `<p>${esc(st.name)}との記録はすべて消えます。</p>`, [
    { label: '消してはじめから', onClick: () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} st = null; closeSheet(); showTitle(); } },
    { label: 'やめる', primary: true, onClick: closeSheet }]);
}

/* ---------- title ---------- */
function showTitle() {
  $('#app').hidden = true;
  const t = $('#title'); t.hidden = false;
  const existing = loadSave();
  const pro = [
    'この街から人がいなくなって、三度目の冬が来る。',
    '[ai]おはようございます、市民番号0417。本日の配給、一名分をお届けします。',
    '管理AI〈ミナト〉は、今日も欠かさず配給を届ける。登録されている市民は、もう私ひとりだけだ。',
    '昨夜、ゴミ集積所で、犬を拾った。'
  ];
  const pHTML = pro.map((l, i) => `<p class="${l.startsWith('[ai]') ? 'ai' : ''}" style="animation-delay:${.4 + i * 1.1}s">${esc(l.replace('[ai]', ''))}</p>`).join('');
  const delay = .4 + pro.length * 1.1;
  const tail = existing
    ? `<div class="cont" style="animation-delay:${delay}s"><button class="btn primary" id="contBtn" type="button">つづきから（${esc(existing.name)}・${existing.day}日目）</button><button class="btn" id="newBtn" type="button">はじめから</button></div>`
    : nameForm(delay);
  t.innerHTML = `<div class="inner"><h1>配給は<span>一人分</span></h1><div class="pro">${pHTML}</div></div>${tail}`;
  if (existing) {
    $('#contBtn').onclick = () => { st = existing; startGame(true); };
    $('#newBtn').onclick = () => { t.querySelector('.cont').outerHTML = nameForm(0); bindForm(); };
  } else bindForm();
}
function nameForm(delay) {
  return `<form id="nameForm" style="animation-delay:${delay}s"><label for="dogName">犬の名前</label><input id="dogName" maxlength="8" value="ハル" autocomplete="off" enterkeyhint="done"><button class="btn primary" type="submit">はじめる</button></form>`;
}
function bindForm() {
  $('#nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = ($('#dogName').value || '').trim() || 'ハル';
    audio();
    st = Core.newGame(name);
    save(); startGame(false);
  });
}
function startGame(resumed) {
  $('#title').hidden = true; $('#app').hidden = false;
  if (resumed) Core.welcomeBack(st, Date.now());
  save(); render();
  if (st.pendingNight) showNight();
  else if (!resumed) { const sc = $('#scene'); sc.classList.add('drone-pass'); setTimeout(sfx.chime, 900); }
}

/* ---------- wiring ---------- */
$('#dog').addEventListener('click', onPet);
$('#dog').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPet(); } });
$('#aFeed').addEventListener('click', onFeed);
$('#aPlay').addEventListener('click', onPlay);
$('#aExplore').addEventListener('click', onExplore);
$('#aRest').addEventListener('click', onRest);
$('#menuBtn').addEventListener('click', onMenu);
document.addEventListener('pointerdown', () => audio(), { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
showTitle();
</script>
